name: Build MSI

on:
  workflow_dispatch:
    inputs:
      version:
        description: MSI version in major.minor.patch format
        required: true
        default: 1.0.0
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-msi:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Select installer version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          }
          else {
            $version = "${{ github.ref_name }}".TrimStart("v")
          }

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version '$version' must use major.minor.patch format."
          }

          "FOCUSTRACE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build FocusTrace MSI
        shell: pwsh
        run: ./build-msi.ps1 -Version $env:FOCUSTRACE_VERSION

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusTrace-${{ env.FOCUSTRACE_VERSION }}-x64
          path: artifacts/installer/FocusTrace-${{ env.FOCUSTRACE_VERSION }}-x64.msi
          if-no-files-found: error
